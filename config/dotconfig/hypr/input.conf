input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    force_no_accel = false
}

gesture = 3, horizontal, workspace

device {
	name=cx-wireless-mouse--1k-dongle-mouse
	sensitivity=-0.1
	enabled = true
	accel_profile = flat
}
